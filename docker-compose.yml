services:
  db:
    image: postgres:16-alpine
    container_name: code-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-codeconnect}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-codeconnect}
      POSTGRES_DB: ${DB_NAME:-codeconnect}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-codeconnect} -d ${DB_NAME:-codeconnect}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
